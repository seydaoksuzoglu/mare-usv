# Parkur-1: 4 koseli dikdortgen waypoint dizisi
# Sim: VRX sydney_regatta. Spawn noktasi (-33.72277, 150.6740 civari) dunyanin
# ENU orijini (-33.724223,150.679736) DEGIL; vrx_gz'nin competition.launch.py
# varsayilan spawn noktasi (orijinden -532,162,0 metre ofset, JSON FDM'de
# GPS Gazebo'nun gercek spawn konumundan sentezleniyor, --custom-location
# etkisiz).
#
# DUZELTME: Spawn noktasinin ~5-18m GUNEYINDE bir iskele/ridhtim yapisi var
# (sydney_regatta.sdf: post_0/1/2, ground_station_0/1/2, antenna -- Gazebo
# yerel x=-527..-545, y=144..157). Ilk rota spawn'i merkez alip guneye de
# uzandigi icin (WP3/WP4) iskelenin ustune gidiyordu ("arac kiyida durdu").
# Duzeltilmis rota tamamen spawn'in KUZEYINE kaydirildi (Gazebo yerel
# x: -540..-525, y: 165..180) ve ~24-29m kuzeydeki seyir samandirasi
# kumesinden (mb_marker_buoy_*/mb_round_buoy_*, x=-528, y=186..191) uzak
# durmak icin 15x15m'ye kucultuldu.
waypoints:
